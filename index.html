<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GhAi - AI Yordamchi</title>
    <!-- Google reCAPTCHA -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        
        #loginContainer {
            background: #1a1a2e;
            padding: 30px 24px;
            border-radius: 24px;
            border: 1px solid #2a2a4a;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            display: block;
        }
        
        #loginContainer h1 {
            color: #fff;
            font-size: 26px;
            margin-bottom: 8px;
        }
        
        #loginContainer h1 span { color: #7c3aed; }
        
        #loginContainer .subtitle {
            color: #888;
            margin-bottom: 24px;
            font-size: 13px;
        }
        
        #loginContainer input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #333;
            background: #12121f;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            margin-bottom: 12px;
        }
        
        #loginContainer input:focus { border-color: #7c3aed; }
        
        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            background: #7c3aed;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-size: 16px;
            width: 100%;
        }
        
        .btn:hover {
            background: #6d28d9;
            transform: scale(1.02);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: transparent;
            border: 1px solid #444;
            color: #aaa;
        }
        
        .btn-secondary:hover {
            background: #222;
            border-color: #7c3aed;
            color: #fff;
        }
        
        #loginError {
            color: #ef4444;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
        
        #loginInfo {
            color: #4ade80;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
        
        .login-timer {
            color: #888;
            font-size: 12px;
            margin-top: 16px;
            border-top: 1px solid #2a2a4a;
            padding-top: 16px;
        }
        
        .login-timer .time {
            color: #a78bfa;
            font-weight: 600;
        }
        
        .login-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        
        .login-actions .btn {
            flex: 1;
            min-width: 100px;
            font-size: 14px;
            padding: 12px 16px;
        }
        
        .recaptcha-container {
            margin: 12px 0;
            display: flex;
            justify-content: center;
            min-height: 78px;
        }
        
        #chatContainer {
            display: none;
            width: 100%;
            max-width: 900px;
            height: 92vh;
            max-height: 800px;
            background: #1a1a2e;
            border-radius: 24px;
            border: 1px solid #2a2a4a;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        
        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid #2a2a4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
        }
        
        .chat-header h2 {
            color: #fff;
            font-size: 18px;
        }
        
        .chat-header h2 span { color: #7c3aed; }
        
        .chat-header .badge {
            background: #7c3aed22;
            color: #a78bfa;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            border: 1px solid #7c3aed44;
        }
        
        .chat-header .header-buttons {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .chat-header .header-buttons button {
            background: #7c3aed44;
            border: 1px solid #7c3aed66;
            color: #a78bfa;
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
            transition: 0.3s;
        }
        
        .chat-header .header-buttons button:hover {
            background: #7c3aed;
            color: #fff;
        }
        
        .chat-messages {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #12121f;
            min-height: 0;
        }
        
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            background: #7c3aed;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        
        .message.bot {
            background: #1e1e36;
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #2a2a4a;
        }
        
        .message.bot .highlight { color: #a78bfa; font-weight: 600; }
        .message.bot .code-block {
            background: #0a0a14;
            padding: 10px 14px;
            border-radius: 8px;
            margin-top: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #4ade80;
            border: 1px solid #2a2a4a;
            word-break: break-all;
            overflow-x: auto;
        }
        
        .typing-indicator {
            color: #666;
            font-size: 13px;
            padding: 8px 16px;
            background: #1a1a2e;
            border-radius: 12px;
            display: inline-block;
            align-self: flex-start;
        }
        
        .typing-indicator span {
            animation: dot 1.2s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes dot {
            0%, 60%, 100% { opacity: 0; }
            30% { opacity: 1; }
        }
        
        .chat-input-area {
            padding: 12px 16px;
            border-top: 1px solid #2a2a4a;
            display: flex;
            gap: 10px;
            background: #1a1a2e;
            flex-shrink: 0;
        }
        
        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid #333;
            background: #12121f;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
            min-width: 0;
        }
        
        .chat-input-area input:focus { border-color: #7c3aed; }
        .chat-input-area input:disabled { opacity: 0.5; cursor: not-allowed; }
        .chat-input-area .btn {
            padding: 12px 20px;
            width: auto;
            flex-shrink: 0;
            font-size: 14px;
        }
        .chat-input-area .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: #7c3aed55; border-radius: 10px; }
        
        @media (max-width: 600px) {
            #loginContainer { padding: 24px 16px; }
            #loginContainer h1 { font-size: 22px; }
            .chat-header { padding: 12px 16px; }
            .chat-header h2 { font-size: 16px; }
            .chat-messages { padding: 12px 14px; }
            .message { max-width: 92%; font-size: 13px; padding: 10px 14px; }
            .chat-input-area { padding: 10px 12px; gap: 8px; }
            .chat-input-area input { font-size: 14px; padding: 10px 14px; }
            .chat-input-area .btn { padding: 10px 16px; font-size: 13px; }
            .login-actions .btn { font-size: 13px; padding: 10px 12px; min-width: 80px; }
            #chatContainer { height: 95vh; max-height: none; border-radius: 16px; }
            .recaptcha-container { transform: scale(0.85); }
        }
        
        @media (max-width: 400px) {
            #loginContainer { padding: 16px 12px; }
            #loginContainer h1 { font-size: 20px; }
            .login-actions { flex-direction: column; }
            .login-actions .btn { min-width: 100%; }
        }
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div id="loginContainer">
        <h1>🔐 <span>Gh</span>Ai</h1>
        <p class="subtitle">Kirish uchun parolingizni kiriting</p>
        
        <input type="password" id="loginPassword" placeholder="Parolni kiriting..." onkeydown="if(event.key==='Enter') login()" autocomplete="off">
        
        <!-- reCAPTCHA -->
        <div class="recaptcha-container">
            <div class="g-recaptcha" data-sitekey="6LfSKlotAAAAAAEgyfZ39Plh3ELwHiBCQkmxP387" data-callback="onRecaptchaSuccess" data-expired-callback="onRecaptchaExpired"></div>
        </div>
        
        <button class="btn" onclick="login()" id="loginBtn" disabled>Kirish</button>
        
        <div class="login-actions">
            <button class="btn btn-secondary" onclick="getCodeFromBot()">🔑 Parol olish</button>
        </div>
        
        <div id="loginError">❌ Noto'g'ri parol!</div>
        <div id="loginInfo">✅ Kirish muvaffaqiyatli!</div>
        
        <div class="login-timer">
            ⏳ Parol <span class="time" id="loginTimer">24 soat</span> davomida amal qiladi
        </div>
    </div>
    
    <!-- CHAT -->
    <div id="chatContainer">
        <div class="chat-header">
            <h2>🤖 <span>Gh</span>Ai</h2>
            <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                <span class="badge" id="sessionTimer">⏳ 24 soat qoldi</span>
                <div class="header-buttons">
                    <button onclick="refreshPassword()">🔄 Yangilash</button>
                    <button onclick="logout()">🚪 Chiqish</button>
                </div>
            </div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                👋 Salom! Men <span class="highlight">GhAi</span> yordamchingizman.<br>
                Telegram botlarini yaratish va boshqarishga yordam beraman.<br><br>
                <span style="color:#888;">✏️ Masalan: <span style="color:#a78bfa;">"Menga bot yaratib ber"</span></span>
            </div>
        </div>
        
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Xabaringizni yozing..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="btn" id="sendBtn" onclick="sendMessage()">Yuborish</button>
        </div>
    </div>

    <script>
        // =======================
        // O'ZGARUVCHILAR
        // =======================
        let user_id = 'unknown';
        let target_id = null;
        let autoLoginTimer = null;
        let recaptchaVerified = false;
        
        // =======================
        // RECAPTCHA
        // =======================
        function onRecaptchaSuccess(token) {
            recaptchaVerified = true;
            document.getElementById('loginBtn').disabled = false;
            document.getElementById('loginBtn').style.opacity = '1';
            document.getElementById('loginBtn').style.cursor = 'pointer';
        }
        
        function onRecaptchaExpired() {
            recaptchaVerified = false;
            document.getElementById('loginBtn').disabled = true;
            document.getElementById('loginBtn').style.opacity = '0.5';
            document.getElementById('loginBtn').style.cursor = 'not-allowed';
        }
        
        // =======================
        // SESSION TEKSHIRISH
        // =======================
        async function checkSession() {
            try {
                const response = await fetch('/api/check_session');
                const data = await response.json();
                
                if (data.valid) {
                    document.getElementById('loginContainer').style.display = 'none';
                    document.getElementById('chatContainer').style.display = 'flex';
                    document.getElementById('sessionTimer').textContent = '⏳ ' + data.expires_in + ' qoldi';
                    document.getElementById('loginTimer').textContent = data.expires_in;
                    return true;
                } else {
                    document.getElementById('loginContainer').style.display = 'block';
                    document.getElementById('chatContainer').style.display = 'none';
                    if (typeof grecaptcha !== 'undefined') {
                        grecaptcha.reset();
                    }
                    recaptchaVerified = false;
                    document.getElementById('loginBtn').disabled = true;
                    return false;
                }
            } catch(e) {
                console.log('Session tekshirishda xatolik:', e);
                return false;
            }
        }
        
        // =======================
        // PAROL OLISH
        // =======================
        async function getCodeFromBot() {
            try {
                const response = await fetch('/api/request_password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: user_id })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('✅ Parol so\'rovi yuborildi!\n\n📌 Parolingiz Telegram bot orqali yuborildi.\n📱 Telegramni tekshiring!');
                } else {
                    alert('❌ Xatolik: ' + (data.error || 'Noma\'lum xato'));
                }
            } catch(e) {
                alert('❌ Xatolik: ' + e.message);
            }
        }
        
        // =======================
        // LOGIN
        // =======================
        async function login() {
            const password = document.getElementById('loginPassword').value;
            const error = document.getElementById('loginError');
            const info = document.getElementById('loginInfo');
            
            error.style.display = 'none';
            info.style.display = 'none';
            
            if (!password) {
                error.textContent = '❌ Parolni kiriting!';
                error.style.display = 'block';
                return;
            }
            
            if (!recaptchaVerified) {
                error.textContent = '❌ Iltimos, "Men robot emasman" ni tasdiqlang!';
                error.style.display = 'block';
                return;
            }
            
            let recaptchaToken = '';
            if (typeof grecaptcha !== 'undefined') {
                recaptchaToken = grecaptcha.getResponse();
            }
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        password: password,
                        recaptcha: recaptchaToken
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    info.textContent = '✅ ' + data.message;
                    info.style.display = 'block';
                    
                    setTimeout(function() {
                        checkSession();
                        document.getElementById('chatInput').focus();
                    }, 1000);
                } else {
                    error.textContent = data.error || '❌ Noto\'g\'ri parol!';
                    error.style.display = 'block';
                    document.getElementById('loginPassword').value = '';
                    document.getElementById('loginPassword').focus();
                    if (typeof grecaptcha !== 'undefined') {
                        grecaptcha.reset();
                    }
                    recaptchaVerified = false;
                    document.getElementById('loginBtn').disabled = true;
                }
            } catch(e) {
                error.textContent = '❌ Server bilan bog\'lanishda xatolik!';
                error.style.display = 'block';
            }
        }
        
        // =======================
        // XABAR YUBORISH
        // =======================
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const sendBtn = document.getElementById('sendBtn');
            const msg = input.value.trim();
            if (!msg) return;
            
            input.disabled = true;
            sendBtn.disabled = true;
            
            addMessage(msg, 'user');
            input.value = '';
            
            const typingId = showTyping();
            
            try {
                const result = await getAIResponse(msg);
                removeTyping(typingId);
                
                if (typeof result === 'object' && result !== null) {
                    if (result.need_login) {
                        addMessage(result.response, 'bot');
                        setTimeout(function() { checkSession(); }, 2000);
                    } else if (result.response) {
                        addMessage(result.response, 'bot');
                    } else {
                        addMessage('❌ Javob olishda xatolik', 'bot');
                    }
                } else if (typeof result === 'string') {
                    addMessage(result, 'bot');
                } else {
                    addMessage('❌ Javob olishda xatolik', 'bot');
                }
            } catch (error) {
                removeTyping(typingId);
                addMessage('❌ Xatolik yuz berdi: ' + error.message, 'bot');
            }
            
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
        }
        
        async function getAIResponse(message) {
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: message,
                        user_id: user_id
                    })
                });
                const data = await response.json();
                return data;
            } catch (error) {
                return { response: '❌ Server bilan bog\'lanishda xatolik!' };
            }
        }
        
        // =======================
        // PAROL YANGILASH
        // =======================
        async function refreshPassword() {
            if (!confirm('⚠️ Parolni yangilashni xohlaysizmi?\n\nYangi parol bot orqali yuboriladi.')) return;
            
            try {
                const response = await fetch('/api/refresh_password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: user_id })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('✅ Parol yangilandi!\n\n🔑 Yangi parol: ' + data.new_password + '\n\n📌 Bot orqali yuborildi!');
                } else {
                    alert(data.error || '❌ Xatolik!');
                }
            } catch(e) {
                alert('❌ Xatolik!');
            }
        }
        
        // =======================
        // CHIQISH
        // =======================
        async function logout() {
            if (!confirm('⚠️ Chiqishni xohlaysizmi?')) return;
            
            try {
                await fetch('/api/logout', { method: 'POST' });
                sessionStorage.clear();
                if (autoLoginTimer) clearTimeout(autoLoginTimer);
                checkSession();
            } catch(e) {
                console.log('Logout xatosi:', e);
            }
        }
        
        // =======================
        // UI YORDAMCHI FUNKSIYALAR
        // =======================
        function addMessage(text, type) {
            var container = document.getElementById('chatMessages');
            var div = document.createElement('div');
            div.className = 'message ' + type;
            
            if (typeof text === 'string') {
                div.innerHTML = text.replace(/\n/g, '<br>');
            } else {
                div.innerHTML = String(text);
            }
            
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        
        function showTyping() {
            var container = document.getElementById('chatMessages');
            var div = document.createElement('div');
            div.className = 'typing-indicator';
            div.id = 'typing_' + Date.now();
            div.innerHTML = '⏳ <span>●</span> <span>●</span> <span>●</span>';
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div.id;
        }
        
        function removeTyping(id) {
            var el = document.getElementById(id);
            if (el) el.remove();
        }
        
        // =======================
        // EVENTLAR
        // =======================
        document.addEventListener('DOMContentLoaded', function() {
            checkSession();
        });
        
        document.getElementById('chatInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });
        
        document.getElementById('loginPassword').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                login();
            }
        });
        
        setInterval(checkSession, 60000);
        
        console.log('🚀 GhAi sayti ishga tushdi!');
        console.log('📌 Parol: ghpay10');
        console.log('⏳ 24 soat davomida amal qiladi');
        console.log('🔒 reCAPTCHA bilan himoyalangan');
    </script>
</body>
</html>
